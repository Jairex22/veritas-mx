{% extends "base.html" %}{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<section class="card narrow"><h1>Cambiar contraseña</h1>
{% if user.profile.must_change_password %}<div class="alert alert-warn">Debe cambiar su contraseña temporal antes de continuar.</div>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Guardar</button></form></section>
{% endblock %}
