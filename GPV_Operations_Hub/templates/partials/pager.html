{% if page.has_other_pages %}<nav class="pager" aria-label="Paginación">
{% if page.has_previous %}<a class="btn btn-sm" href="?{% if query %}{{ query }}&{% endif %}page={{ page.previous_page_number }}">‹ Anterior</a>{% endif %}
<span class="muted small">Página {{ page.number }} de {{ page.paginator.num_pages }} · {{ page.paginator.count }} elementos</span>
{% if page.has_next %}<a class="btn btn-sm" href="?{% if query %}{{ query }}&{% endif %}page={{ page.next_page_number }}">Siguiente ›</a>{% endif %}
</nav>{% endif %}
